[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-edit-demo"
version = "0.1.0"
description = "Data-independent scaffold for natural-language multitrack music editing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=18,<19",
  "librosa>=0.11,<1",
  "numba>=0.61,<0.62",
  "numpy>=1.26,<2.3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
music-edit-demo = "music_edit_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
